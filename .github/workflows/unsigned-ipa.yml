name: Unsigned iOS IPA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Which macOS runner to build on"
        type: choice
        default: github
        options: [github, self-hosted]

permissions:
  contents: write

concurrency:
  # Renamed once: the previous `unsigned-ios-refs/heads/main` group jammed after a
  # never-started self-hosted job was cancelled — every later run on main sat
  # "pending" with zero jobs, dispatches included. A new key is a new queue.
  group: ipa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # GitHub-hosted macOS by default: it is always there, and this build is under
    # three minutes on it. The org's own Apple Silicon Mac is someone's machine
    # and is sometimes simply off — a job aimed at an offline runner queues
    # silently rather than failing, which is how a release got stranded once.
    # `workflow_dispatch` can still send a run to the Mac when it is known to be
    # up.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","macOS","ARM64"]') || fromJSON('["macos-26"]') }}
    # A self-hosted runner is a machine in someone's house. On a public repository, a workflow
    # that runs on pull requests will happily run a stranger's code on it — this is the first
    # thing GitHub's own documentation warns about. A pull request from a fork gets no runner
    # here; one from a branch of this repository, which only people with write access can push,
    # does.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A self-hosted runner keeps its workspace between runs, so a previous
      # run's Codeg.app would still be sitting in build/ — and the packaging
      # step below only checks that the app EXISTS. Start from nothing so a
      # green run can only ever mean this commit compiled.
      - name: Clean previous build
        run: rm -rf build CodegiOS.xcodeproj

      - name: Toolchain
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project CodegiOS.xcodeproj \
            -scheme CodegiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Codeg.app"
          test -d "$APP"
          test ! -d "$APP/_CodeSignature"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          BASENAME="Codeg-${VERSION}-${BUILD}-unsigned"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$APP" "build/ipa/Payload/Codeg.app"
          (
            cd build/ipa
            zip -qry "${BASENAME}.ipa" Payload
            shasum -a 256 "${BASENAME}.ipa" > "${BASENAME}.ipa.sha256"
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.basename }}
          path: |
            build/ipa/${{ steps.package.outputs.basename }}.ipa
            build/ipa/${{ steps.package.outputs.basename }}.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tapaixx release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.1-tapaixx.6
          BASENAME: ${{ steps.package.outputs.basename }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD: ${{ steps.package.outputs.build }}
        run: |
          set -euxo pipefail
          IPA="build/ipa/${BASENAME}.ipa"
          SHA="build/ipa/${BASENAME}.ipa.sha256"

          cat > build/release-notes.md <<EOF
          ## Codeg iOS ${VERSION} (${BUILD}) — tapaixx: the web client, in the app

          The screens are now the codeg web client's. The app loads
          `/workspace` from the selected server in a WKWebView — the same page a
          phone browser shows — so the UI is exactly the web client at whatever
          version your server runs.

          - Servers and tokens stay native (Keychain); the token is handed to the
            page before it runs, so it never shows the login form. The title bar
            is the server switcher; a rejected token becomes an "edit the server"
            state.
          - Same-origin navigation stays in-app; other links open in Safari.
          - Live Activity / Dynamic Island, continued processing and actionable
            background notifications now attach natively to every running session
            on the server, regardless of which client started it.
          - Live Activity taps and `codeg://conversation/<id>` links open the
            conversation through the web client's own deep-link query.

          Build 8. The native SwiftUI screens from earlier builds are unreachable
          and will be removed in a later build.

          The attached IPA is **unsigned** and is intended for downstream signing/sideloading workflows.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$SHA" --clobber
            gh release edit "$TAG" --notes-file build/release-notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$IPA" "$SHA" \
              --title "Codeg iOS ${VERSION} (${BUILD}) - tapaixx" \
              --notes-file build/release-notes.md \
              --target "$GITHUB_SHA"
          fi
