name: Unsigned iOS IPA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Which macOS runner to build on"
        type: choice
        default: self-hosted
        options: [self-hosted, github]

permissions:
  contents: write

concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The org's own Apple Silicon Mac by default. It is someone's machine, so it
    # is sometimes simply off — and a job aimed at an offline runner queues
    # silently rather than failing. `workflow_dispatch` can therefore send a run
    # to a GitHub-hosted runner instead; every other trigger uses the Mac.
    runs-on: ${{ inputs.runner == 'github' && fromJSON('["macos-26"]') || fromJSON('["self-hosted","macOS","ARM64"]') }}
    # A self-hosted runner is a machine in someone's house. On a public repository, a workflow
    # that runs on pull requests will happily run a stranger's code on it — this is the first
    # thing GitHub's own documentation warns about. A pull request from a fork gets no runner
    # here; one from a branch of this repository, which only people with write access can push,
    # does.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A self-hosted runner keeps its workspace between runs, so a previous
      # run's Codeg.app would still be sitting in build/ — and the packaging
      # step below only checks that the app EXISTS. Start from nothing so a
      # green run can only ever mean this commit compiled.
      - name: Clean previous build
        run: rm -rf build CodegiOS.xcodeproj

      - name: Toolchain
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project CodegiOS.xcodeproj \
            -scheme CodegiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Codeg.app"
          test -d "$APP"
          test ! -d "$APP/_CodeSignature"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          BASENAME="Codeg-${VERSION}-${BUILD}-unsigned"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$APP" "build/ipa/Payload/Codeg.app"
          (
            cd build/ipa
            zip -qry "${BASENAME}.ipa" Payload
            shasum -a 256 "${BASENAME}.ipa" > "${BASENAME}.ipa.sha256"
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.basename }}
          path: |
            build/ipa/${{ steps.package.outputs.basename }}.ipa
            build/ipa/${{ steps.package.outputs.basename }}.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tapaixx release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.1-tapaixx.5
          BASENAME: ${{ steps.package.outputs.basename }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD: ${{ steps.package.outputs.build }}
        run: |
          set -euxo pipefail
          IPA="build/ipa/${BASENAME}.ipa"
          SHA="build/ipa/${BASENAME}.ipa.sha256"

          cat > build/release-notes.md <<EOF
          ## Codeg iOS ${VERSION} (${BUILD}) — tapaixx web design-system port

          Continues the port of the codeg web client's design system onto iOS. The
          foundation (colour tokens, Inter/JetBrains Mono, flat surfaces) shipped in
          the previous build; this one finishes the screens.

          - Rebuilds the composer as the web's single bordered box: the "+" and the
            send button now live *inside* the border on an action row, the field no
            longer floats as a narrowing pill, and send is the web's paper plane with
            a destructive Square for stop.
          - Finishes the icon migration. Every glyph on the app's own canvas is now a
            Lucide face from the same set the web imports; SF Symbols are kept only on
            system surfaces (toolbars, context menus, swipe actions, the tab bar),
            where the native glyph is the right one.
          - Drops the editorial card around each session group. The web's sidebar has
            no card: a group is a header over a plain column. The whole group stays a
            single tap target for the fullscreen drill-in.
          - Corrects the section header to the web's real treatment (14pt regular at
            sidebar-foreground/50, not a smaller muted step).
          - Removes the last Liquid Glass container left in the app.

          The attached IPA is **unsigned** and is intended for downstream signing/sideloading workflows.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$SHA" --clobber
            gh release edit "$TAG" --notes-file build/release-notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$IPA" "$SHA" \
              --title "Codeg iOS ${VERSION} (${BUILD}) - tapaixx" \
              --notes-file build/release-notes.md \
              --target "$GITHUB_SHA"
          fi
