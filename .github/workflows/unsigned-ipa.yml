name: Unsigned iOS IPA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Which macOS runner to build on"
        type: choice
        default: github
        options: [github, self-hosted]

permissions:
  contents: write

concurrency:
  # Renamed once: the previous `unsigned-ios-refs/heads/main` group jammed after a
  # never-started self-hosted job was cancelled — every later run on main sat
  # "pending" with zero jobs, dispatches included. A new key is a new queue.
  group: ipa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # GitHub-hosted macOS by default: it is always there, and this build is under
    # three minutes on it. The org's own Apple Silicon Mac is someone's machine
    # and is sometimes simply off — a job aimed at an offline runner queues
    # silently rather than failing, which is how a release got stranded once.
    # `workflow_dispatch` can still send a run to the Mac when it is known to be
    # up.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","macOS","ARM64"]') || fromJSON('["macos-26"]') }}
    # A self-hosted runner is a machine in someone's house. On a public repository, a workflow
    # that runs on pull requests will happily run a stranger's code on it — this is the first
    # thing GitHub's own documentation warns about. A pull request from a fork gets no runner
    # here; one from a branch of this repository, which only people with write access can push,
    # does.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A self-hosted runner keeps its workspace between runs, so a previous
      # run's CodegWeb.app would still be sitting in build/ — and the packaging
      # step below only checks that the app EXISTS. Start from nothing so a
      # green run can only ever mean this commit compiled.
      - name: Clean previous build
        run: rm -rf build CodegiOS.xcodeproj

      - name: Toolchain
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project CodegiOS.xcodeproj \
            -scheme CodegiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/CodegWeb.app"
          test -d "$APP"
          test ! -d "$APP/_CodeSignature"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          BASENAME="CodegWeb-${VERSION}-unsigned"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$APP" "build/ipa/Payload/CodegWeb.app"
          (
            cd build/ipa
            zip -qry "${BASENAME}.ipa" Payload
            shasum -a 256 "${BASENAME}.ipa" > "${BASENAME}.ipa.sha256"
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.basename }}
          path: |
            build/ipa/${{ steps.package.outputs.basename }}.ipa
            build/ipa/${{ steps.package.outputs.basename }}.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      # A push to main only builds. A release is a version tag: bump the two
      # version lines in project.yml, commit, `git tag v<version>`, push the tag.
      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          BASENAME: ${{ steps.package.outputs.basename }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD: ${{ steps.package.outputs.build }}
        run: |
          set -euxo pipefail
          # The tag names the release; it must be the version the app was built with.
          TAG="${GITHUB_REF_NAME}"
          test "$TAG" = "v${VERSION}" || { echo "tag $TAG != app version v${VERSION}"; exit 1; }
          IPA="build/ipa/${BASENAME}.ipa"
          SHA="build/ipa/${BASENAME}.ipa.sha256"

          cat > build/release-notes.md <<EOF
          ## Codeg Web for iOS ${VERSION} (${BUILD})

          - Coming back from the background no longer loses the text the agent
            streamed meanwhile: the page's event socket is reconnected on every
            return to the foreground.
          - A running turn is picked up within a round-trip over the server's
            `conversation://changed` WebSocket side-channel; the 25s poll is now
            only the safety net.
          - The Dynamic Island stays up: the continued-processing task reports real
            progress (it reported none, which the system expires), a turn's event
            socket retries for up to ten minutes, and the island is titled after
            the conversation.
          - The native title bar is gone; the server switcher is a small pill in
            the empty middle of the web client's own title bar, with Reload in its
            menu.
          - No long-press menus on touch: neither the page's context menus nor its
            floating selection toolbar open from a long press; iOS's own selection
            callout is the one that shows. Mouse and trackpad keep the page's.
          - Releases are cut from a `v<version>` tag; a push to main only builds.

          The attached IPA is **unsigned** and is intended for downstream signing/sideloading workflows.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$SHA" --clobber
            gh release edit "$TAG" --notes-file build/release-notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$IPA" "$SHA" \
              --title "Codeg Web for iOS ${VERSION} (${BUILD})" \
              --notes-file build/release-notes.md \
              --target "$GITHUB_SHA"
          fi
